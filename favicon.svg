<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" fill="#8B2500"/>
  
  <!-- Mortar lines (horizontal) -->
  <rect x="0" y="7" width="32" height="1" fill="#D4A76A" opacity="0.6"/>
  <rect x="0" y="15" width="32" height="1" fill="#D4A76A" opacity="0.6"/>
  <rect x="0" y="23" width="32" height="1" fill="#D4A76A" opacity="0.6"/>
  <rect x="0" y="31" width="32" height="1" fill="#D4A76A" opacity="0.6"/>
  
  <!-- Mortar lines (vertical - alternating rows) -->
  <!-- Row 1 -->
  <rect x="10" y="0" width="1" height="8" fill="#D4A76A" opacity="0.6"/>
  <rect x="21" y="0" width="1" height="8" fill="#D4A76A" opacity="0.6"/>
  
  <!-- Row 2 (offset) -->
  <rect x="5" y="8" width="1" height="8" fill="#D4A76A" opacity="0.6"/>
  <rect x="16" y="8" width="1" height="8" fill="#D4A76A" opacity="0.6"/>
  <rect x="27" y="8" width="1" height="8" fill="#D4A76A" opacity="0.6"/>
  
  <!-- Row 3 -->
  <rect x="10" y="16" width="1" height="8" fill="#D4A76A" opacity="0.6"/>
  <rect x="21" y="16" width="1" height="8" fill="#D4A76A" opacity="0.6"/>
  
  <!-- Row 4 (offset) -->
  <rect x="5" y="24" width="1" height="8" fill="#D4A76A" opacity="0.6"/>
  <rect x="16" y="24" width="1" height="8" fill="#D4A76A" opacity="0.6"/>
  <rect x="27" y="24" width="1" height="8" fill="#D4A76A" opacity="0.6"/>
  
  <!-- Add some brick texture/shading -->
  <rect x="0" y="0" width="10" height="7" fill="#A52A2A" opacity="0.3"/>
  <rect x="11" y="0" width="10" height="7" fill="#CD5C5C" opacity="0.2"/>
  <rect x="22" y="0" width="10" height="7" fill="#8B2500" opacity="0.2"/>
  
  <rect x="0" y="8" width="5" height="7" fill="#CD5C5C" opacity="0.2"/>
  <rect x="6" y="8" width="10" height="7" fill="#A52A2A" opacity="0.3"/>
  <rect x="17" y="8" width="10" height="7" fill="#8B2500" opacity="0.2"/>
  <rect x="28" y="8" width="4" height="7" fill="#CD5C5C" opacity="0.2"/>
  
  <rect x="0" y="16" width="10" height="7" fill="#8B2500" opacity="0.2"/>
  <rect x="11" y="16" width="10" height="7" fill="#A52A2A" opacity="0.3"/>
  <rect x="22" y="16" width="10" height="7" fill="#CD5C5C" opacity="0.2"/>
  
  <rect x="0" y="24" width="5" height="8" fill="#A52A2A" opacity="0.3"/>
  <rect x="6" y="24" width="10" height="8" fill="#CD5C5C" opacity="0.2"/>
  <rect x="17" y="24" width="10" height="8" fill="#A52A2A" opacity="0.3"/>
  <rect x="28" y="24" width="4" height="8" fill="#8B2500" opacity="0.2"/>
</svg>