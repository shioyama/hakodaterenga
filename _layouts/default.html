<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta name="keywords" content="函館,弁天町,レンガ,煉瓦,弁天倉庫,柳田倉庫,函館どつくレンガ倉庫,函館どつく,函館ドック,名村造船,山田総合,赤レンガ倉庫,函館観光,函館歴史,産業遺産,近代化遺産,明治建築,函館港,北海道遺産">
    <meta name="author" content="{{ site.author }}">
    <meta name="robots" content="index, follow">
    <meta name="language" content="Japanese">
    <meta name="geo.region" content="JP-01">
    <meta name="geo.placename" content="函館市弁天町">
    <meta name="geo.position" content="41.7769;140.7089">
    <meta name="ICBM" content="41.7769, 140.7089">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{{ site.url }}{{ page.url | remove: 'index.html' }}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:image" content="{{ site.url }}/img/social-card-og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:site_name" content="函館の隠れた煉瓦">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ site.url }}{{ page.url }}">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
    <meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    <meta name="twitter:image" content="{{ site.url }}/img/social-card-twitter.jpg">
    <meta name="twitter:site" content="@{{ site.social.twitter }}">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/img/favicon-192.png">

    <link rel="stylesheet" href="/styles.css?v={{ site.time | date: '%s' }}">
    <link rel="preload" as="image" href="/img/hero-warehouses.jpg" fetchpriority="high">
    <link rel="dns-prefetch" href="https://hakodaterenga.jp">
    <link rel="preconnect" href="https://hakodaterenga.jp">
    <script defer data-domain="hakodaterenga.jp" src="https://plausible.io/js/script.file-downloads.hash.outbound-links.pageview-props.tagged-events.js"></script>
    <script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>

    {% include structured-data.html %}

    {% if site.google_analytics %}
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics }}');
    </script>

    <!-- Event snippet for Page view conversion page -->
    <script>
      gtag('event', 'conversion', {
      'send_to': '{{ site.google_analytics }}/TalzCPvWwYIbEK6k1YJB',
      'value': 1.0,
      'currency': 'JPY'
    }); </script>
    {% endif %}
</head>
<body>
    {% include navigation.html %}
    
    {{ content }}
    
    <footer>
      <p>&copy; 2025 {{ site.author }} | <a href="mailto:info@hakodaterenga.jp">info@hakodaterenga.jp</a></p>
    </footer>
    
    <!-- Lightbox Modal -->
    <div id="lightboxModal" class="lightbox-modal">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightboxImage" alt="拡大画像">
    </div>
    
    <script src="/script.js?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
